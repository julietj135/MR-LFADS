on_init_end_calls:
  _target_: mrlfads.callbacks.OnEpochEndCalls
  callbacks:
    - _target_: mrlfads.callbacks.get_maximum_activity_units
    - _target_: mrlfads.callbacks.get_default_conditions
    - _target_: mrlfads.callbacks.Log
      tags:
        - "lr-AdamW"
    - _target_: mrlfads.callbacks.InferredRatesPlot
      log_every_n_epochs: 50
      smooth: false
      n_samples: 8
    - _target_: mrlfads.callbacks.InferredPredsPlot
      log_every_n_epochs: 50
      smooth: false
      n_samples: 5
    - _target_: mrlfads.callbacks.ProctorSummaryPlot
      log_every_n_epochs: 50
