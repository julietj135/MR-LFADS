_target_: mrlfads.model.MRLFADS

# ----- DATA ----- #
# Dataset parameters
num_other_areas: 3
seq_len: 47
ic_enc_seq_len: 5

# Validation: Holdout Neurons
hn_indices:
  MOp: '${eval:"[[0, 1, 2, 3, 4] for _ in range(19)]"}'
  RSP: ${model.hn_indices.MOp}
  SSp-tr: ${model.hn_indices.MOp}
  VISp: ${model.hn_indices.MOp}

# ----- LEARNING RATE ----- #
lr_init: 4.0e-3
lr_stop: 1.0e-5
lr_decay: 0.95
lr_patience: 6
lr_adam_beta1: 0.9
lr_adam_beta2: 0.999
lr_adam_epsilon: 1.0e-8
weight_decay: 0.0

# ----- REGULARIZATION ----- #
# KL divergence regularization #may need to change this
kl_start_epoch_co: 20
kl_increase_epoch_co: 200 
kl_start_epoch_com: 150
kl_increase_epoch_com: 100
kl_co_scale: 1
kl_com_scale: 0.1
kl_ic_scale: ${model.kl_co_scale}

# L2 regularization
l2_start_epoch: 100
l2_increase_epoch: 80
l2_scale: 1.0e+4

# Other regularization
dropout_rate: 0.3
cell_clip: 5.0
detach_hn: true

# ----- MODEL ARCHITECTURE ----- #
areas_params:
    MOp:
        # Data
        num_neurons:
          n0: 57
          n1: ${model.areas_params.MOp.num_neurons.n0}
          n2: ${model.areas_params.MOp.num_neurons.n0}
          n3: ${model.areas_params.MOp.num_neurons.n0}
          n4: ${model.areas_params.MOp.num_neurons.n0}
          n5: ${model.areas_params.MOp.num_neurons.n0}
