            - ${model.areas_params.VISp.readout.modules.0} # session 8
            - ${model.areas_params.VISp.readout.modules.0} # session 9
            - ${model.areas_params.VISp.readout.modules.0} # session 10
            - ${model.areas_params.VISp.readout.modules.0} # session 11
            - ${model.areas_params.VISp.readout.modules.0} # session 12
            - ${model.areas_params.VISp.readout.modules.0} # session 13
            - ${model.areas_params.VISp.readout.modules.0} # session 14
            - ${model.areas_params.VISp.readout.modules.0} # session 15
            - ${model.areas_params.VISp.readout.modules.0} # session 16
            - ${model.areas_params.VISp.readout.modules.0} # session 17
            - ${model.areas_params.VISp.readout.modules.0} # session 18

        # Priors / Posteriors
        output_dist:
          _target_: mrlfads.utils.torch_utils.Gaussian
        co_prior:
          _target_: mrlfads.utils.torch_utils.MultivariateNormal
          mean: 0
          variance: 0.1
          shape: ${model.areas_params.VISp.co_dim}
        ic_prior:
          _target_: mrlfads.utils.torch_utils.MultivariateNormal
          mean: 0
          variance: 0.1
          shape: ${model.areas_params.VISp.ic_dim}
        com_prior:
          _target_: mrlfads.utils.torch_utils.MultivariateNormal
          mean: 0
          variance: 0.1
          shape: ${eval:${model.areas_params.VISp.com_dim} * ${model.num_other_areas}}
        ic_post_var_min: 1.0e-4
        co_post_var_min: 1.0e-4
        com_post_var_min: 1.0e-4
        
        # Regularization
        kl_ic_scale: ${model.kl_ic_scale}
        kl_co_scale: ${model.kl_co_scale}
        kl_com_scale: ${model.kl_com_scale}