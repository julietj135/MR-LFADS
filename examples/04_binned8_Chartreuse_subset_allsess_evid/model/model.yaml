          n9: ${model.areas_params.MOp.num_neurons.n0}
          n10: ${model.areas_params.MOp.num_neurons.n0}
          n11: ${model.areas_params.MOp.num_neurons.n0}
          n12: ${model.areas_params.MOp.num_neurons.n0}
          n13: ${model.areas_params.MOp.num_neurons.n0}
          n14: ${model.areas_params.MOp.num_neurons.n0}
          n15: ${model.areas_params.MOp.num_neurons.n0}
          n16: ${model.areas_params.MOp.num_neurons.n0}
          n17: ${model.areas_params.MOp.num_neurons.n0}
          n18: ${model.areas_params.MOp.num_neurons.n0}
        ext_input_dim: 0
    
        # Architecture
        data_dim: 64
        ic_enc_dim: 64 
        ci_enc_dim: 64 
        ci_lag: 0
        con_dim: 128 
        co_dim: 6
        ic_dim: 64 
        gen_dim: ${eval:${model.areas_params.MOp.num_neurons.n0} * 2}
        fac_dim: ${model.areas_params.MOp.data_dim}
        com_dim: 10

        # Readin / Readout
        readin:
          _target_: torch.nn.ModuleList
          modules:
            - _target_: mrlfads.utils.torch_utils.ScaledLinear
              in_features: ${model.areas_params.MOp.num_neurons.n0}
              out_features: ${model.areas_params.MOp.data_dim}
