_target_: mrlfads.model.MRLFADS

# ----- DATA ----- #
# Dataset parameters
num_other_areas: 3
seq_len: 62
ic_enc_seq_len: 15 # before the first tower appears, use as IC, so dynamics of full evid period is estimated

# Validation: Holdout Neurons
hn_indices:
  MOp: 
    - [0, 1, 2, 3, 4]
  RSP: 
    - [0, 1, 2, 3, 4]
  SSp-tr:
    - [0, 1, 2, 3, 4]
  VISp:
    - [0, 1, 2, 3, 4]

# ----- LEARNING RATE ----- #
lr_init: 4.0e-3
lr_stop: 1.0e-5
lr_decay: 0.95
lr_patience: 6
lr_adam_beta1: 0.9
lr_adam_beta2: 0.999
lr_adam_epsilon: 1.0e-8
weight_decay: 0.0

# ----- REGULARIZATION ----- #
# KL divergence regularization #may need to change this
kl_start_epoch_co: 20
kl_increase_epoch_co: 200 
kl_start_epoch_com: 150
kl_increase_epoch_com: 100
kl_co_scale: 1
kl_com_scale: 0.1
kl_ic_scale: ${model.kl_co_scale}

# L2 regularization
l2_start_epoch: 100
l2_increase_epoch: 80
l2_scale: 1.0e+4

# Other regularization
dropout_rate: 0.3
cell_clip: 5.0
detach_hn: true

# ----- MODEL ARCHITECTURE ----- #
areas_params:
    MOp:
        # Data
        num_neurons:
          n0: 57
        ext_input_dim: 0
    
        # Architecture
        data_dim: 64
        ic_enc_dim: 32 
        ci_enc_dim: 32 
        ci_lag: 0
        con_dim: 64 
        co_dim: 6
        ic_dim: 32 
        gen_dim: ${eval:${model.areas_params.MOp.num_neurons.n0} * 2}
        fac_dim: ${model.areas_params.MOp.data_dim}
        com_dim: 10

        # Readin / Readout
        readin:
          _target_: torch.nn.ModuleList
          modules:
            - _target_: mrlfads.utils.torch_utils.ScaledLinear
              in_features: ${model.areas_params.MOp.num_neurons.n0}
              out_features: ${model.areas_params.MOp.data_dim}
              
        readout:
          _target_: torch.nn.ModuleList
          modules:
            - _target_: mrlfads.utils.torch_utils.ScaledLinear
              in_features: ${model.areas_params.MOp.fac_dim}
              out_features: ${eval:${model.areas_params.MOp.num_neurons.n0} * 2}

        # Priors / Posteriors
        output_dist:
          _target_: mrlfads.utils.torch_utils.Gaussian
        co_prior:
          _target_: mrlfads.utils.torch_utils.MultivariateNormal
          mean: 0
          variance: 0.1
          shape: ${model.areas_params.MOp.co_dim}
        ic_prior:
          _target_: mrlfads.utils.torch_utils.MultivariateNormal
          mean: 0
          variance: 0.1
          shape: ${model.areas_params.MOp.ic_dim}
        com_prior:
          _target_: mrlfads.utils.torch_utils.MultivariateNormal
          mean: 0
          variance: 0.1
          shape: ${eval:${model.areas_params.MOp.com_dim} * ${model.num_other_areas}}
        ic_post_var_min: 1.0e-4
        co_post_var_min: 1.0e-4
        com_post_var_min: 1.0e-4
        
        # Regularization
        kl_ic_scale: ${model.kl_ic_scale}
        kl_co_scale: ${model.kl_co_scale}
        kl_com_scale: ${model.kl_com_scale}
        
    RSP:
        # Data
        num_neurons:
          n0: 50
        ext_input_dim: 0
    
        # Architecture
        data_dim: 64
